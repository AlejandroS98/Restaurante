services: 

  db: 
    image: postgres:15-alpine # Usamos una imagen ligera de postgres
    container_name: alexdb_frontend
    restart: always
    environment: 
      POSTGRES_USER: alex
      POSTGRES_PASSWORD: restaurante
      POSTGRES_DB: alexdb_core
    ports: 
      - "5432:5432" #Mapea el puerto del contenedor al de su maquina
    volumes:
      - postgres_data50:/var/lib/postgresql/data

  # Definicion del volumen para que los datos no se pierdan al reiniciar el contenedor
volumes: 
  postgres_data50: